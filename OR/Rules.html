<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="author" content="Enzo Alexander">
    <meta name="description" content="A Webpage for Enzo TCG">
    <meta name="keywords" content="TCG, Trading Card Game, interactive">
    <meta name="veiwport" content="width:device-width, initial-scale = 1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Enzo TCG</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="shortcut icon" href="../Assets/EnzoTCGSymbol.png">
    <style media="screen">
    </style>
  </head>
  <body id="body">
    <header class="TitleHeader">
      <img src="../Assets/EnzoTCGSymbol.png" alt="Logo" id="EnzoTCGLogo" title="To Home Page">
        <span class="EZTCG">EnzoTCG</span>
      <div class="ButtonBox">
        <button type="button" name="button" style="background:cyan;"><img src="../Assets/Cards.png" alt="Cards" class="filtericon" title="Cards"></button>

        <button type="button" name="button" style="background:cyan"><img src="../Assets/Rules.png" alt="Clear Filters" class="filtericon" title="Clear Filters"></button>
      </div>
    </header>

    <div class="ButtonList">
      <!-- Reset -->
      <button type="button" name="button" onclick="resetfilters()" class="FilterButtons"><img src="../Assets/ClearFilters.png" alt="Clear Filters" class="filtericon" title="Clear Filters"></button>
      <!-- Elements -->
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Biological')"><img src="../Assets/Elements/Biological.png" alt="Filter to only Biological" class="filtericon" title="Filter to only Biological"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Digital')"><img src="../Assets/Elements/Digital.png" alt="Filter to only Digital" class="filtericon" title="Filter to only Digital"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Earth')"><img src="../Assets/Elements/Earth.png" alt="Filter to only Earth" class="filtericon" title="Filter to only Earth"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Electricity')"><img src="../Assets/Elements/Electricity.png" alt="Filter to only Electricity" class="filtericon" title="Filter to only Electricity"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Fire')"><img src="../Assets/Elements/Fire.png" alt="Filter to only Fire" class="filtericon" title="Filter to only Fire"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Frost')"><img src="../Assets/Elements/Frost.png" alt="Filter to only Frost" class="filtericon" title="Filter to only Frost"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Negative')"><img src="../Assets/Elements/Negative.png" alt="Filter to only Negative" class="filtericon" title="Filter to only Negative"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Omni')"><img src="../Assets/Elements/Omni.png" alt="Filter to only Omni" class="filtericon" title="Filter to only Omni"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Positive')"><img src="../Assets/Elements/Positive.png" alt="Filter to only Positive" class="filtericon" title="Filter to only Positive"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Time')"><img src="../Assets/Elements/Time.png" alt="Filter to only Time" class="filtericon" title="Filter to only Time"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Water')"><img src="../Assets/Elements/Water.png" alt="Filter to only Water" class="filtericon" title="Filter to only Water"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filtertype('Wind')"><img src="../Assets/Elements/Wind.png" alt="Filter to only Wind" class="filtericon" title="Filter to only Wind"></button>
      <!-- EX -->
      <button type="button" name="button" class="FilterButtons" onclick="filterex(true)"><img src="../Assets/EX.png" alt="Filter to only EX" class="filtericon" title="Filter to only EX"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterex(false)"><img src="../Assets/noEX.png" alt="Filter to only non-EX" class="filtericon" title="Filter to only non-EX"></button>
      <!-- Archetypes -->
      <button type="button" name="button" class="FilterButtons" onclick="filterarcheall()"><img src="../Assets/Characters.png" alt="Filter to only Characters" class="filtericon" title="Filter to only Characters"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Character')"><img src="../Assets/BasicCharacter.png" alt="Filter to only basic characters" class="filtericon" title="Filter to only basic characters"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Enhanced Character')"><img src="../Assets/ECharacter.png" alt="Filter to only Enhanced Characters" class="filtericon" title="Filter to only Enhanced Characters"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Item')"><img src="../Assets/Items.png" alt="Filter to only Items" class="filtericon" title="Filter to only Items"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Setting')"><img src="../Assets/Settings.png" alt="Filter to only Settings" class="filtericon" title="Filter to only Settings"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarcheallsum()"><img src="../Assets/AllSummons.png" alt="Filter to only Summons" class="filtericon" title="Filter to only Summons"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Summon')"><img src="../Assets/Summons.png" alt="Filter to only basic Summons" class="filtericon" title="Filter to only basic Summons"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterarche('Enhanced Summon')"><img src="../Assets/EnhancedSummons.png" alt="Filter to only Enhanced Summons" class="filtericon" title="Filter to only Enhanced Summons"></button>
      <!-- Rarity -->
      <button type="button" name="button" class="FilterButtons" onclick="filterrar('Common')"><img src="../Assets/CommonCards.png" alt="Filter to only Common Cards" class="filtericon" title="Filter to only Common Cards"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterrar('Rare')"><img src="../Assets/RareCards.png" alt="Filter to only Rare Cards" class="filtericon" title="Filter to only Rare Cards"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterrar('ColorArt')"><img src="../Assets/ColorArt.png" alt="Filter to only Color Arts" class="filtericon" title="Filter to only Color Arts"></button>
      <button type="button" name="button" class="FilterButtons" onclick="filterrar('FullArt')"><img src="../Assets/FullArt.png" alt="Filter to only Full Arts" class="filtericon" title="Filter to only Full Arts"></button>
      <!-- Misc. -->
      <button type="button" name="button" style="background:red;" onclick="hidezoom()"><img src="../Assets/SidePanel.png" alt="Hide the Side Pannel" class="filtericon" title="Hide the Side Pannel"></button>
    </div>
    <div id="CardDisplay">
      <div id="Cardlist">

      </div>
      <div id="CardZoom">
        <div id="BigCard">
          <img src="" alt="" id="zoomedInCard">
          <div id="CardInfo">
            <p id="cardName" title="Card Name"></p>
            <p id="cardArche" title="Card Archetype"></p>
            <div id="cardElement" title="Card Element"></div>
            <p id="cardHP" title="Card HP"></p>
            <p id="cardAbility" title="Card Ability"></p>
            <div class="Attack">
              <p id="cardAttack1name" title="Card Move 1"></p>
              <div id="cardAttack1Element" title="Move 1 Element">&nbsp;</div>
              <p id="cardAttack1Damage" title="Move 1 Damage">&nbsp;</p>
              <p id="cardAttack1Description" title="Move 1 description">&nbsp;</p>
            </div>
            <br>
            <div class="Attack">
              <p id="cardAttack2name" title="Card Move 2"></p>
              <div id="cardAttack2Element" title="Move 2 Element">&nbsp;</div>
              <p id="cardAttack2Damage" title="Move 2 Damage">&nbsp;</p>
              <p id="cardAttack2Description" title="Move 2 description">&nbsp;</p>
            </div>
            <table id="elementInteractions">
              <thead>
                <th colspan="2" style="background:red;">Negative Interactions</th>
                <th colspan="2" style="background:green;">Positive Interactions</th>
              </thead>
              <tbody>
                <tr>
                  <td id="neg50e"><img src="" alt="" class="elementalCost" id="neg50Elem"></td>
                  <td id="neg50"><p>-50</p></td>

                  <td id="pos50e"><img src="" alt="" class="elementalCost" id="pos50Elem"></td>
                  <td id="pos50"><p>+50</p></td>
                </tr>

                <tr>
                  <td id="neg40e"><img src="" alt="" class="elementalCost" id="neg40Elem"></td>
                  <td id="neg40"><p>-40</p></td>

                  <td id="pos40e"><img src="" alt="" class="elementalCost" id="pos40Elem"></td>
                  <td id="pos40"><p>+40</p></td>
                </tr>

                <tr>
                  <td id="neg30e"><img src="" alt="" class="elementalCost" id="neg30Elem"></td>
                  <td id="neg30"><p>-30</p></td>

                  <td id="pos30e"><img src="" alt="" class="elementalCost" id="pos30Elem"></td>
                  <td id="pos30"><p>+30</p></td>
                </tr>

                <tr>
                  <td id="neg20e"><img src="" alt="" class="elementalCost" id="neg20Elem"></td>
                  <td id="neg20"><p>-20</p></td>

                  <td id="pos20e"><img src="" alt="" class="elementalCost" id="pos20Elem"></td>
                  <td id="pos20"><p>+20</p></td>
                </tr>

                <tr>
                  <td id="neg10e"><img src="" alt="" class="elementalCost" id="neg10Elem"></td>
                  <td id="neg10"><p>-10</p></td>

                  <td id="pos10e"><img src="" alt="" class="elementalCost" id="pos10Elem"></td>
                  <td id="pos10"><p>+10</p></td>
                </tr>

              </tbody>
            </table>
            <p id="cardSeries" title="Card Series"></p>
            <p id="cardCopyright" title="Card Copyright"></p>
            <p id="cardRCost" title="Card Retreat Cost"></p>



          </div>
        </div>
      </div>
    </div>


    <script type="text/javascript" src="../js/Script.js"></script>
  </body>
</html>
